name: CI

# Restore and build only. The automated test suite (unit + SQL Server integration tests)
# ran throughout development and finalization but is not part of the submitted repository;
# see docs/09-TEST-STRATEGY.md for the strategy that was applied before submission.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Faed.slnx

      - name: Build
        run: dotnet build Faed.slnx --no-restore --configuration Release
